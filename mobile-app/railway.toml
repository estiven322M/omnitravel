# Versión web de OmniTravel en Railway (raíz del servicio: mobile-app/).
# EXPO_PUBLIC_API_URL (variable del servicio) se fija en el build.
# Ver docs/DESPLIEGUE.md.
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npx expo export -p web"

[deploy]
startCommand = "node scripts/servir-web.mjs"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
