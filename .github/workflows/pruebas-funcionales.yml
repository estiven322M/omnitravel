# Pruebas funcionales de la API desplegada (Postman + Newman).
# Se lanza a mano (Actions → Pruebas funcionales → Run workflow) o cada
# lunes. Crea 4 usuarios de prueba por ejecución, por eso no corre en cada push.
# Los casos del moderador (CP-F312 a CP-F314) usan los secretos
# MODERADOR_EMAIL y MODERADOR_CLAVE; sin ellos esos tres casos se omiten.
name: Pruebas funcionales

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL del backend a probar
        required: true
        default: https://omnitravel-production-4af6.up.railway.app
  schedule:
    - cron: '0 13 * * 1'

jobs:
  newman:
    name: Colección Postman (31 casos, 3 procesos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Ejecutar la colección
        env:
          MODERADOR_EMAIL: ${{ secrets.MODERADOR_EMAIL }}
          MODERADOR_CLAVE: ${{ secrets.MODERADOR_CLAVE }}
        run: |
          npx --yes newman@6 run postman/omnitravel.postman_collection.json \
            --env-var "baseUrl=${{ inputs.base_url || 'https://omnitravel-production-4af6.up.railway.app' }}" \
            --env-var "email_moderador=$MODERADOR_EMAIL" \
            --env-var "clave_moderador=$MODERADOR_CLAVE" \
            --reporters cli,junit,json \
            --reporter-junit-export reports/junit-postman.xml \
            --reporter-json-export reports/newman.json
      - name: Anotar resultados
        if: always()
        run: node postman/anotar-resultados.mjs reports/newman.json
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reporte-postman
          path: reports/
